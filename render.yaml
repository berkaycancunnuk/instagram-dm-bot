services:
  - type: web
    name: ig-dm-bot
    runtime: python3
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: VERIFY_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
      - key: PAGE_ID
        sync: false
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: GRAPH_API_VERSION
        value: v21.0
      - key: DEBUG
        value: "0"